[project]
name = "agent-book-code"
version = "0.1.0"
description = "配套代码：大模型 Agent 系统开发"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    # LLM
    "openai>=1.50.0",
    "anthropic>=0.39.0",
    "tiktoken>=0.8.0",

    # 框架
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "llama-index>=0.12.0",
    "crewai>=0.80.0",

    # 数据 / 向量
    "qdrant-client>=1.12.0",
    "chromadb>=0.5.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",

    # 工程
    "pydantic>=2.8.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",

    # 观测
    "langfuse>=2.50.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",

    # 服务
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "redis>=5.1.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "N"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["ch*/tests", "projects/*/tests"]
