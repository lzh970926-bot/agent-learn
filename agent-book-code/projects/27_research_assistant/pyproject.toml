[project]
name = "research-assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "crewai>=0.80.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "tavily-python>=0.5.0",
    "fastapi>=0.115.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "langfuse>=2.50.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]
